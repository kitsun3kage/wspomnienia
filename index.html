<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nasza Klasa — Album</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: radial-gradient(ellipse at 50% 15%, #3a4160 0%, #171a26 55%, #0a0c11 100%);
    font-family: Georgia, 'Times New Roman', serif;
    user-select: none; -webkit-tap-highlight-color: transparent;
  }
  .scena { perspective: 2600px; }
  .ksiazka {
    position: relative;
    width: min(92vw, calc(72vh * 1.5), 1000px);
    aspect-ratio: 3 / 2;
    cursor: pointer;
  }
  .ksiazka::after {
    content: ''; position: absolute;
    left: 5%; right: 5%; bottom: -7%; height: 14%;
    background: radial-gradient(ellipse at 50% 0%, rgba(0,0,0,.7), transparent 70%);
    filter: blur(12px); z-index: -1; pointer-events: none;
  }
  .arkusz {
    position: absolute; top: 0; right: 0; width: 50%; height: 100%;
    transform-origin: left center; transform-style: preserve-3d;
    transform: rotateY(0deg);
    transition: transform .9s cubic-bezier(.42,.05,.25,1);
    will-change: transform;
    z-index: calc(var(--total) - var(--i));
  }
  .arkusz.obrocony { transform: rotateY(-180deg); z-index: calc(var(--total) + var(--i) + 1); }
  .arkusz.animacja { z-index: 9999; }
  
  .strona {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden; background: #fdfaf3;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  .strona.przod { border-radius: 0 6px 6px 0; }
  .strona.tyl   { transform: rotateY(180deg); border-radius: 6px 0 0 6px; }
  .strona::after { content: ''; position: absolute; top: 0; bottom: 0; width: 34px; pointer-events: none; }
  .przod::after { left: 0;  background: linear-gradient(to right, rgba(0,0,0,.18), transparent); }
  .tyl::after   { right: 0; background: linear-gradient(to left,  rgba(0,0,0,.18), transparent); }

  /* NUMERACJA */
  .nr-strony {
    position: absolute;
    bottom: 4%;
    font-size: clamp(.7rem, 1.3vw, 1rem);
    color: #9a8f78;
    font-family: Georgia, serif;
    letter-spacing: .1em;
    z-index: 10;
  }
  .nr-strony.prawa { right: 9%; }
  .nr-strony.lewa  { left: 9%; }

  /* OKŁADKA PRZÓD */
  .okladka {
    width: 100%; height: 100%;
    background: linear-gradient(140deg, #2c3a68 0%, #1d2748 55%, #141b33 100%);
    color: #e9d9a3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 8%; position: relative;
    border-left: 10px solid #0f1528;
  }
  .okladka::before {
    content: ''; position: absolute; inset: 6%;
    border: 1px solid rgba(233,217,163,.45); border-radius: 2px; pointer-events: none;
  }
  .okladka h1 {
    font-size: clamp(1.1rem, 3.4vw, 2.4rem);
    letter-spacing: .14em; text-transform: uppercase;
    text-align: center; font-weight: normal; line-height: 1.25;
  }
  .okladka .podtytul { font-size: clamp(.6rem, 1.5vw, 1rem); letter-spacing: .28em; text-transform: uppercase; opacity: .8; }
  .okladka .linia    { width: 46%; height: 1px; background: rgba(233,217,163,.6); margin: 6px 0; }
  .okladka .rok      { font-size: clamp(.65rem, 1.6vw, 1.05rem); letter-spacing: .2em; }
  .okladka .hint {
    position: absolute; bottom: 11%;
    font-size: clamp(.5rem, 1.2vw, .78rem);
    letter-spacing: .18em; opacity: .55; text-transform: uppercase;
    animation: puls 2.4s ease-in-out infinite;
  }
  @keyframes puls { 0%,100%{opacity:.25} 50%{opacity:.75} }

  /* TYLNA OKŁADKA (KONIEC) */
  .okladka-tyl {
    width: 100%; height: 100%;
    background: linear-gradient(140deg, #2c3a68 0%, #1d2748 55%, #141b33 100%);
    color: #e9d9a3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 8%; position: relative;
    border-left: 10px solid #0f1528;
  }
  .okladka-tyl::before {
    content: ''; position: absolute; inset: 6%;
    border: 1px solid rgba(233,217,163,.45); border-radius: 2px; pointer-events: none;
  }
  .okladka-tyl .banner {
    width: 70px; height: 70px;
    border: 1px solid rgba(233,217,163,.55);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(.9rem, 1.8vw, 1.3rem);
    letter-spacing: .1em;
    margin-bottom: 4px;
  }
  .okladka-tyl h1 {
    font-size: clamp(1.6rem, 4.4vw, 3rem);
    letter-spacing: .22em; text-transform: uppercase;
    text-align: center; font-weight: normal; line-height: 1.2;
  }
  .okladka-tyl .linia { width: 40%; height: 1px; background: rgba(233,217,163,.5); margin: 4px 0; }
  .okladka-tyl .podtytul { font-size: clamp(.6rem, 1.5vw, 1rem); letter-spacing: .3em; text-transform: uppercase; opacity: .85; }
  .okladka-tyl .rok { font-size: clamp(.65rem, 1.6vw, 1.05rem); letter-spacing: .2em; opacity: .7; }
  .okladka-tyl .klik {
    position: absolute; bottom: 11%;
    font-size: clamp(.5rem, 1.2vw, .78rem);
    letter-spacing: .22em; text-transform: uppercase;
    opacity: .55;
    animation: puls 2.4s ease-in-out infinite;
  }

  /* KONIEC OVERLAY (desktop) */
  .koniec-overlay {
    position: absolute; inset: 0; z-index: 10000;
    opacity: 0; pointer-events: none;
    transition: opacity .5s ease;
    cursor: pointer;
    border-radius: 6px;
    overflow: hidden;
  }
  .koniec-overlay.aktywny { opacity: 1; pointer-events: auto; }
  .koniec-overlay .okladka-tyl { border-radius: 6px; }

  /* ============ KOLLAŻ 4 ZDJĘĆ ============ */
  .collage {
    width: 100%; height: 100%;
    padding: 5% 5%;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 3%;
    pointer-events: none;
  }
  .collage.n1 { grid-template-columns: 1fr; grid-template-rows: 1fr; padding: 8% 12%; }
  .collage.n2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; padding: 10% 6%; }
  .collage.n3 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .collage.n3 .slot:nth-child(3) {
    grid-column: 1 / -1;
    width: 50%;
    justify-self: center;
  }

  .slot {
    display: flex; align-items: center; justify-content: center;
    min-width: 0; min-height: 0;
    position: relative;
    pointer-events: none;
  }

  .polaroid {
    background: #fff;
    padding: 6px 6px 24px 6px;
    box-shadow: 0 8px 20px rgba(0,0,0,.32);
    box-sizing: border-box;
    position: relative;
    width: 100%; height: 100%;
    transition: box-shadow .3s ease, filter .3s ease;
    cursor: zoom-in;
    pointer-events: auto;
    backface-visibility: hidden; /* Zapobiega glitchom 3D na lewej stronie */
  }
  .polaroid img {
    display: block;
    width: 100%; height: 100%;
    object-fit: cover;
    pointer-events: none; /* Kliknięcie przechodzi do polaroidu */
    -webkit-user-drag: none;
    user-select: none;
  }
  .polaroid .nr-foto {
    position: absolute;
    bottom: 4px; left: 0; width: 100%;
    text-align: center;
    font-family: Georgia, serif;
    font-size: clamp(.55rem, 1.1vw, .85rem);
    color: #6a6354;
    letter-spacing: .12em;
    pointer-events: none;
  }

  /* Rozrzucenie */
  .p1 { transform: rotate(-3.5deg); }
  .p2 { transform: rotate(3deg); }
  .p3 { transform: rotate(2.5deg); }
  .p4 { transform: rotate(-3deg); }
  
  /* Bezpieczny efekt najechania (bez psucia animacji 3D) */
  .polaroid:hover {
    box-shadow: 0 14px 34px rgba(0,0,0,.45), 0 0 0 3px rgba(233,217,163,.8);
    filter: brightness(1.05);
    z-index: 20;
  }

  .pusta { width: 100%; height: 100%; background: #fdfaf3; }

  /* PRZYCISKI */
  .sterowanie {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; z-index: 100;
  }
  .sterowanie button {
    width: 52px; height: 52px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06);
    color: #e9d9a3; font-size: 26px; line-height: 1; cursor: pointer;
    backdrop-filter: blur(6px); transition: background .2s, transform .15s;
    font-family: Georgia, serif;
  }
  .sterowanie button:hover  { background: rgba(255,255,255,.16); }
  .sterowanie button:active { transform: scale(.93); }
  .sterowanie button:disabled { opacity: .22; cursor: default; }

  /* LIGHTBOX */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.94); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    cursor: zoom-out; opacity: 0; transition: opacity .3s; pointer-events: none;
  }
  .lightbox.active { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: 95vw; max-height: 95vh; object-fit: contain;
    border: 4px solid #fff; border-radius: 4px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
    transform: scale(.95); transition: transform .3s;
  }
  .lightbox.active img { transform: scale(1); }

  /* EKRANY */
  .ekran { position: fixed; inset: 0; display: grid; place-items: center; padding: 20px; text-align: center; z-index: 500; }
  .ekran[hidden] { display: none; }
  .ekran-box { max-width: 540px; width: 100%; color: #e9d9a3; }
  .ekran h2 { font-size: clamp(1.3rem, 3.5vw, 1.8rem); font-weight: normal; letter-spacing: .12em; margin-bottom: 12px; }
  .ekran p  { opacity: .78; line-height: 1.55; font-size: .92rem; margin-bottom: 16px; }
  .ekran code { background: rgba(255,255,255,.1); padding: 2px 6px; border-radius: 3px; font-size: .88em; }
  .ekran .debug {
    margin: 14px 0; padding: 12px; background: rgba(0,0,0,.3); border-radius: 6px;
    font-family: 'Consolas', monospace; font-size: .76rem; text-align: left;
    color: #c8b98a; line-height: 1.5; word-break: break-word; opacity: .9;
    max-height: 220px; overflow: auto; white-space: pre-wrap;
  }

  .haslo-form { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .haslo-input {
    width: 100%; max-width: 320px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(233,217,163,.35);
    color: #e9d9a3; padding: 14px 20px; border-radius: 999px;
    font-family: inherit; font-size: 1.05rem; letter-spacing: .15em;
    text-align: center; outline: none; transition: border-color .2s;
  }
  .haslo-input:focus { border-color: rgba(233,217,163,.75); }
  .haslo-input.zle   { border-color: #d76a6a; animation: trzesienie .35s; }
  @keyframes trzesienie {
    0%,100% { transform: translateX(0); }
    25%     { transform: translateX(-8px); }
    75%     { transform: translateX(8px); }
  }
  .btn {
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(233,217,163,.35);
    color: #e9d9a3; padding: 14px 30px; border-radius: 999px;
    font-family: inherit; font-size: .95rem; letter-spacing: .08em;
    cursor: pointer; transition: background .2s;
  }
  .btn:hover { background: rgba(255,255,255,.14); }
  .btn + .btn { margin-left: 10px; }
  .btn:disabled { opacity: .4; cursor: default; }

  /* ================= MOBILE ================= */
  .czytnik {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    padding: 10px 10px 90px;
  }
  .strona-mobile {
    width: min(calc(100vw - 20px), calc(82vh * 0.75), 520px);
    aspect-ratio: 3 / 4;
    background: #fdfaf3;
    border-radius: 8px;
    box-shadow: 0 10px 40px rgba(0,0,0,.55);
    position: relative;
    overflow: hidden;
  }
  .strona-mobile .nr-strony {
    bottom: 3%;
    right: 6%;
    left: auto;
    position: absolute;
    font-size: .85rem;
  }
  .strona-mobile .collage,
  .strona-mobile .okladka,
  .strona-mobile .okladka-tyl,
  .strona-mobile .pusta {
    width: 100%; height: 100%;
  }
  .strona-mobile .okladka,
  .strona-mobile .okladka-tyl { border-left-width: 8px; }

  @media (max-width: 768px) {
    body { display: block; overflow: hidden; }
    .scena { display: none; }
    .nr-strony.prawa, .nr-strony.lewa { display: none; }
    
    .collage { padding: 4% 4%; gap: 2%; }
    .collage.n1 { padding: 6% 8%; }
    .collage.n2 { padding: 8% 4%; }
    .polaroid { padding: 4px 4px 16px 4px; }
    .polaroid .nr-foto { bottom: 2px; font-size: .55rem; }
  }
</style>
</head>
<body>

<!-- EKRAN HASŁA -->
<div id="ekranHasla" class="ekran">
  <div class="ekran-box">
    <h2>Album klasy</h2>
    <p>Wpisz hasło, aby otworzyć album.</p>
    <form id="formHasla" class="haslo-form">
      <input id="poleHasla" class="haslo-input" type="password"
             autocomplete="off" autocapitalize="none" spellcheck="false"
             placeholder="hasło" autofocus>
      <button class="btn" type="submit">Otwórz</button>
    </form>
    <p id="bladHasla" style="margin-top:16px; color:#d76a6a; opacity:1; min-height:1.2em;"></p>
  </div>
</div>

<!-- EKRAN ŁADOWANIA -->
<div id="ekranLadowania" class="ekran" hidden>
  <div class="ekran-box"><p>Ładowanie zdjęć…</p></div>
</div>

<!-- EKRAN BŁĘDU -->
<div id="ekranWyboru" class="ekran" hidden>
  <div class="ekran-box">
    <h2>Nie udało się wczytać zdjęć</h2>
    <p id="wybor-opis"></p>
    <div id="wybor-debug" class="debug" hidden></div>
    <button id="wybierzFolder" class="btn">Wybierz folder ręcznie</button>
    <button id="sprobujPonownie" class="btn">Spróbuj ponownie</button>
    <input type="file" id="plikFolder" webkitdirectory directory multiple accept="image/*" hidden>
  </div>
</div>

<!-- ALBUM -->
<div id="album" hidden></div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" hidden>
  <img id="img-lightbox" src="" alt="Powiększone zdjęcie">
</div>

<script>
/* ================================================================
   KONFIGURACJA
   ================================================================ */
const HASLO = 'klasa8a';

const KONFIG = {
  uzytkownik: 'kitsun3kage',
  repo:       'wspomnienia',
  folder:     'zdjęcia',
};

const TYTUL    = 'Nasza Klasa';
const PODTYTUL = 'Album wspomnień';
const ROK      = '2019 / 2027';
/* ================================================================ */

const ekranHasla     = document.getElementById('ekranHasla');
const ekranLadowania = document.getElementById('ekranLadowania');
const ekranWyboru    = document.getElementById('ekranWyboru');
const albumEl        = document.getElementById('album');
const formHasla      = document.getElementById('formHasla');
const poleHasla      = document.getElementById('poleHasla');
const bladHasla      = document.getElementById('bladHasla');

/* Lightbox */
const lightbox   = document.getElementById('lightbox');
const imgLightbox = document.getElementById('img-lightbox');
lightbox.addEventListener('click', () => {
  lightbox.classList.remove('active');
  setTimeout(() => { lightbox.hidden = true; }, 300);
});

function otworzLightbox(src) {
  imgLightbox.src = src;
  lightbox.hidden = false;
  requestAnimationFrame(() => lightbox.classList.add('active'));
}

/* Podpięcie zdjęć + auto-sizing polaroidów */
function podepnijZdjecia(root) {
  root.querySelectorAll('.polaroid').forEach(pol => {
    const img = pol.querySelector('img');
    if (!img) return;
    
    // Kliknięcie w cały polaroid (nie tylko samo zdjęcie)
    pol.addEventListener('click', (e) => {
      e.stopPropagation(); // Zapobiega przewróceniu strony
      otworzLightbox(img.src);
    });

    if (img.complete && img.naturalWidth) dopasujPolaroid(img);
    else img.addEventListener('load', () => dopasujPolaroid(img));
  });
}

function dopasujPolaroid(img) {
  const pol = img.closest('.polaroid');
  if (!pol || !img.naturalWidth) return;
  const slot = pol.parentElement;
  if (!slot) return;

  const slotW = slot.clientWidth;
  const slotH = slot.clientHeight;
  if (!slotW || !slotH) return;

  const style = getComputedStyle(pol);
  const padL = parseFloat(style.paddingLeft);
  const padR = parseFloat(style.paddingRight);
  const padT = parseFloat(style.paddingTop);
  const padB = parseFloat(style.paddingBottom);
  const padX = padL + padR;
  const padY = padT + padB;

  const ar = img.naturalWidth / img.naturalHeight;
  const availW = slotW - padX - 10;
  const availH = slotH - padY - 10;
  if (availW <= 0 || availH <= 0) return;

  let imgW = availW;
  let imgH = imgW / ar;
  if (imgH > availH) {
    imgH = availH;
    imgW = imgH * ar;
  }

  pol.style.width  = (imgW + padX) + 'px';
  pol.style.height = (imgH + padY) + 'px';
}

function dopasujWszystkiePolaroidy() {
  albumEl.querySelectorAll('.polaroid img').forEach(dopasujPolaroid);
}

/* Uruchomienie */
if (sessionStorage.getItem('album-ok') === '1') {
  ekranHasla.hidden = true;
  start();
}

formHasla.addEventListener('submit', (e) => {
  e.preventDefault();
  const wpisane = poleHasla.value.trim().toLowerCase();
  if (wpisane === HASLO.toLowerCase()) {
    sessionStorage.setItem('album-ok', '1');
    ekranHasla.hidden = true;
    start();
  } else {
    poleHasla.classList.remove('zle');
    void poleHasla.offsetWidth;
    poleHasla.classList.add('zle');
    bladHasla.textContent = 'Nieprawidłowe hasło.';
    poleHasla.select();
  }
});

/* ---------- START ---------- */
async function start() {
  ekranLadowania.hidden = false;
  const wynik = await pobierzListeZdjec();
  ekranLadowania.hidden = true;
  if (wynik.zdjecia && wynik.zdjecia.length > 0) {
    uruchomAlbum(wynik.zdjecia);
  } else {
    pokazWybor(wynik.debug);
  }
}

/* ---------- REPO ---------- */
function kandydaciRepo() {
  if (KONFIG.uzytkownik && KONFIG.repo) return [{ user: KONFIG.uzytkownik, repo: KONFIG.repo }];
  const wynik = [];
  const host = location.hostname;
  if (host.endsWith('.github.io')) {
    const user = host.replace(/\.github\.io$/, '');
    const segs = location.pathname.split('/').filter(Boolean);
    if (segs.length > 0 && !segs[0].includes('.')) wynik.push({ user, repo: segs[0] });
    wynik.push({ user, repo: `${user}.github.io` });
  }
  return wynik;
}

async function pobierzListeZdjec() {
  const kandydaci = kandydaciRepo();
  const debug = [];
  if (kandydaci.length === 0) {
    debug.push('Nie wykryto repo.');
    return { zdjecia: null, debug: debug.join('\n') };
  }
  for (const k of kandydaci) {
    const res = await pobierzZRepo(k.user, k.repo, debug);
    if (res && res.length > 0) return { zdjecia: res, debug: debug.join('\n') };
  }
  return { zdjecia: null, debug: debug.join('\n') };
}

async function pobierzZRepo(user, repo, debug) {
  const api = `https://api.github.com/repos/${user}/${repo}/git/trees/HEAD?recursive=1`;
  let resp;
  try {
    resp = await fetch(api, { headers: { Accept: 'application/vnd.github+json' } });
  } catch (e) { return null; }
  if (!resp.ok) return null;

  let data;
  try { data = await resp.json(); } catch (e) { return null; }
  if (!data.tree) return null;

  const wzorFoto = /\.(jpe?g|png|gif|webp|avif|bmp)$/i;
  let wszystkie = data.tree.filter(it => it.type === 'blob' && wzorFoto.test(it.path));
  wszystkie = wszystkie.filter(it => !/(^|\/)\./.test(it.path));

  let pliki = wszystkie;
  const folder = (KONFIG.folder || '').replace(/^\/+|\/+$/g, '');
  if (folder && wszystkie.length > 0) {
    const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/ł/g, 'l');
    const fNorm = norm(folder);
    const wFolderze = wszystkie.filter(it => {
      const segs = it.path.split('/');
      return segs.length > 1 && norm(segs[0]) === fNorm;
    });
    if (wFolderze.length > 0) { pliki = wFolderze; }
  }

  pliki.sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }));
  const base = new URL('./', location.href).href;
  return pliki.map(it => base + it.path.split('/').map(encodeURIComponent).join('/'));
}

/* ---------- EKRAN BŁĘDU ---------- */
function pokazWybor(debug) {
  ekranLadowania.hidden = true;
  ekranWyboru.hidden = false;
  const debugBox = document.getElementById('wybor-debug');
  if (debug) { debugBox.hidden = false; debugBox.textContent = debug; }

  const input = document.getElementById('plikFolder');
  document.getElementById('wybierzFolder').onclick  = () => input.click();
  document.getElementById('sprobujPonownie').onclick = () => {
    Object.keys(localStorage).filter(k => k.startsWith('album')).forEach(k => localStorage.removeItem(k));
    location.reload();
  };
  input.onchange = () => {
    const pliki = [...input.files].filter(f => /^image\//.test(f.type));
    if (pliki.length === 0) { alert('Brak zdjęć.'); return; }
    pliki.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    ekranWyboru.hidden = true;
    uruchomAlbum(pliki.map(f => URL.createObjectURL(f)));
  };
}

/* ============================================================
   BUDOWA ALBUMU
   ============================================================ */
function uruchomAlbum(zdjecia) {
  ekranLadowania.hidden = true;
  ekranWyboru.hidden = true;
  albumEl.hidden = false;

  // Po 4 zdjęcia na stronę
  const pages = [{ typ: 'okladka' }];
  for (let i = 0; i < zdjecia.length; i += 4) {
    const foty = [];
    for (let j = 0; j < 4 && i + j < zdjecia.length; j++) {
      foty.push({ src: zdjecia[i + j], nr: i + j + 1 });
    }
    pages.push({ typ: 'foto', foty });
  }
  if (pages.length % 2 !== 0) pages.push({ typ: 'pusta' });

  // Numeracja stron (okładka i puste bez numeru)
  for (let i = 0; i < pages.length; i++) {
    if (i === 0 || pages[i].typ === 'pusta') pages[i].pageNum = null;
    else pages[i].pageNum = i;
  }

  const isMobile = window.matchMedia('(max-width: 768px)').matches;
  if (isMobile) initMobile(pages);
  else initDesktop(pages);
}

/* ============================================================
   DESKTOP — książka 3D
   ============================================================ */
function initDesktop(pages) {
  const sheets = [];
  for (let i = 0; i < pages.length; i += 2) {
    sheets.push({ przod: pages[i], tyl: pages[i + 1] });
  }

  albumEl.innerHTML = `
    <div class="scena">
      <div class="ksiazka" id="ksiazka"></div>
    </div>
    <div class="sterowanie">
      <button id="wstecz" aria-label="Wstecz">‹</button>
      <button id="dalej" aria-label="Dalej">›</button>
    </div>
  `;

  const ksiazka = document.getElementById('ksiazka');
  const elementy = [];

  sheets.forEach((ark, i) => {
    const el = document.createElement('div');
    el.className = 'arkusz';
    el.style.setProperty('--i', i);
    el.style.setProperty('--total', sheets.length);

    const nrPrzod = ark.przod.pageNum ? `<span class="nr-strony prawa">${ark.przod.pageNum}</span>` : '';
    const nrTyl   = ark.tyl.pageNum   ? `<span class="nr-strony lewa">${ark.tyl.pageNum}</span>`   : '';

    el.innerHTML = `
      <div class="strona przod">${htmlStrony(ark.przod)}${nrPrzod}</div>
      <div class="strona tyl">${htmlStrony(ark.tyl)}${nrTyl}</div>`;
    ksiazka.appendChild(el);
    elementy.push(el);
  });

  // Overlay końcowy (tylna okładka)
  const overlay = document.createElement('div');
  overlay.className = 'koniec-overlay';
  overlay.innerHTML = htmlStrony({ typ: 'koniec' });
  ksiazka.appendChild(overlay);

  podepnijZdjecia(ksiazka);

  let aktualny = 0;
  const btnWstecz = document.getElementById('wstecz');
  const btnDalej  = document.getElementById('dalej');

  function odswiez() {
    elementy.forEach((el, i) => el.classList.toggle('obrocony', i < aktualny));
    btnWstecz.disabled = aktualny <= 0;
    btnDalej.disabled  = aktualny >= elementy.length;
    overlay.classList.toggle('aktywny', aktualny >= elementy.length);
  }

  function przewroc(kier) {
    if (kier > 0 && aktualny >= elementy.length) return;
    if (kier < 0 && aktualny <= 0) return;
    const idx = kier > 0 ? aktualny : aktualny - 1;
    const el  = elementy[idx];
    el.classList.add('animacja');
    void el.offsetWidth;
    aktualny += kier;
    odswiez();
    setTimeout(() => el.classList.remove('animacja'), 950);
  }

  ksiazka.addEventListener('click', (e) => {
    if (overlay.classList.contains('aktywny') && overlay.contains(e.target)) {
      aktualny = 0;
      odswiez();
      return;
    }
    const r = ksiazka.getBoundingClientRect();
    przewroc((e.clientX - r.left) > r.width / 2 ? 1 : -1);
  });

  btnDalej.onclick  = () => przewroc(1);
  btnWstecz.onclick = () => przewroc(-1);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) {
      lightbox.classList.remove('active');
      setTimeout(() => { lightbox.hidden = true; }, 300);
    }
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); przewroc(1); }
    if (e.key === 'ArrowLeft')                   { e.preventDefault(); przewroc(-1); }
  });

  requestAnimationFrame(dopasujWszystkiePolaroidy);
  window.addEventListener('resize', debounce(dopasujWszystkiePolaroidy, 150));

  odswiez();
}

/* ============================================================
   MOBILE — jedna strona na ekran
   ============================================================ */
function initMobile(pages) {
  const mobilePages = pages.filter(p => p.typ !== 'pusta');
  mobilePages.push({ typ: 'koniec' });

  albumEl.innerHTML = `
    <div class="czytnik">
      <div class="strona-mobile" id="stronaMobile"></div>
    </div>
    <div class="sterowanie">
      <button id="wstecz" aria-label="Wstecz">‹</button>
      <button id="dalej" aria-label="Dalej">›</button>
    </div>
  `;

  const stronaEl  = document.getElementById('stronaMobile');
  const btnWstecz = document.getElementById('wstecz');
  const btnDalej  = document.getElementById('dalej');
  let idx = 0;

  function render() {
    const s = mobilePages[idx];
    const nr = s.pageNum ? `<span class="nr-strony">${s.pageNum}</span>` : '';
    stronaEl.innerHTML = htmlStrony(s) + nr;
    stronaEl.style.cursor = (s.typ === 'koniec') ? 'pointer' : '';
    podepnijZdjecia(stronaEl);
    requestAnimationFrame(dopasujWszystkiePolaroidy);

    btnWstecz.disabled = idx <= 0;
    btnDalej.disabled  = idx >= mobilePages.length - 1;
  }

  stronaEl.addEventListener('click', (e) => {
    const s = mobilePages[idx];
    if (s.typ === 'koniec') {
      idx = 0;
      render();
    }
  });

  btnDalej.onclick  = () => { if (idx < mobilePages.length - 1) { idx++; render(); } };
  btnWstecz.onclick = () => { if (idx > 0) { idx--; render(); } };

  // Swipe
  let startX = null;
  stronaEl.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; }, { passive: true });
  stronaEl.addEventListener('touchend', (e) => {
    if (startX === null) return;
    const dx = e.changedTouches[0].clientX - startX;
    if (Math.abs(dx) > 50) {
      if (dx < 0 && idx < mobilePages.length - 1) { idx++; render(); }
      if (dx > 0 && idx > 0) { idx--; render(); }
    }
    startX = null;
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && lightbox.classList.contains('active')) {
      lightbox.classList.remove('active');
      setTimeout(() => { lightbox.hidden = true; }, 300);
    }
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (idx < mobilePages.length - 1) { idx++; render(); } }
    if (e.key === 'ArrowLeft')                   { e.preventDefault(); if (idx > 0) { idx--; render(); } }
  });

  window.addEventListener('resize', debounce(dopasujWszystkiePolaroidy, 150));

  render();
}

/* ============================================================
   HTML strony
   ============================================================ */
function htmlStrony(s) {
  if (s.typ === 'okladka') {
    return `<div class="okladka">
      <h1>${TYTUL}</h1>
      <p class="podtytul">${PODTYTUL}</p>
      <div class="linia"></div>
      <p class="rok">${ROK}</p>
      <p class="hint">Kliknij, aby otworzyć</p>
    </div>`;
  }
  if (s.typ === 'foto') {
    const count = s.foty.length;
    const extraClass = count === 1 ? ' n1' : count === 2 ? ' n2' : count === 3 ? ' n3' : '';
    
    const fotyHTML = s.foty.map((f, i) => `
      <div class="slot">
        <div class="polaroid p${i + 1}">
          <img src="${f.src}" alt="Zdjęcie ${f.nr}">
          <span class="nr-foto">${f.nr}</span>
        </div>
      </div>
    `).join('');

    return `<div class="collage${extraClass}">${fotyHTML}</div>`;
  }
  if (s.typ === 'koniec') {
    return `<div class="okladka-tyl">
      <div class="banner">8A</div>
      <h1>Koniec</h1>
      <div class="linia"></div>
      <p class="podtytul">Dziękujemy za obejrzenie</p>
      <p class="rok">${ROK}</p>
      <p class="klik">Kliknij, aby otworzyć od nowa</p>
    </div>`;
  }
  return `<div class="pusta"></div>`;
}

/* Narzędzia */
function debounce(fn, ms) {
  let t;
  return function () {
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, arguments), ms);
  };
}
